spring:
  datasource:
    # Railway: добавьте DATABASE_JDBC_URL = jdbc:postgresql://${{Postgres.PGHOST}}:${{Postgres.PGPORT}}/${{Postgres.PGDATABASE}}
    # Local: использует localhost по умолчанию
    url: ${DATABASE_JDBC_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:messenger}}
    username: ${PGUSER:${POSTGRES_USER:postgres}}
    password: ${PGPASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

server:
  port: ${PORT:3000}
  error:
    whitelabel:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  # 15 min access + 30 day refresh is the industry-standard pattern
  # (short enough to limit token-theft blast radius, long enough to avoid
  # constant refresh storms on flaky mobile networks). Override via env.
  access-expires: ${JWT_ACCESS_EXPIRES:900}
  refresh-expires: ${JWT_REFRESH_EXPIRES:2592000}

file:
  max-size-bytes: ${FILE_MAX_SIZE_BYTES:104857600}
  # Railway: задайте FILE_UPLOAD_DIR=/app/uploads и подключите Volume с mount path /app/uploads
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
  # Railway: автоматически через RAILWAY_PUBLIC_DOMAIN. Или задайте FILE_PUBLIC_BASE_URL вручную
  public-base-url: ${FILE_PUBLIC_BASE_URL:http://localhost:3000/uploads}

r2:
  endpoint: ${R2_ENDPOINT:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket-name: ${R2_BUCKET_NAME:}
  public-url: ${R2_PUBLIC_URL:}

fcm:
  service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}
  service-account-file: ${FCM_SERVICE_ACCOUNT_FILE:}
  project-id: ${FCM_PROJECT_ID:}
  client-email: ${FCM_CLIENT_EMAIL:}
  client-id: ${FCM_CLIENT_ID:}
  private-key: ${FCM_PRIVATE_KEY:}
  private-key-id: ${FCM_PRIVATE_KEY_ID:}

# Shared secret: bot-gateway must send this header to core (/internal/v1/bot/**).
# Generate a long random string in production.
messenger:
  internal-bot-gateway-key: ${INTERNAL_BOT_GATEWAY_KEY:}

# Bot subsystem tuning. Defaults are chosen so a single noisy bot can't
# starve chat traffic; override per-environment via env vars.
bot:
  ratelimit:
    send:
      # Per-second + per-minute budget applied to /internal/v1/bot/sendMessage
      # (keyed on bot.id). Returns HTTP 429 when exceeded.
      per-second: ${BOT_RATELIMIT_PER_SECOND:5}
      per-minute: ${BOT_RATELIMIT_PER_MINUTE:60}
  webhook:
    # Bounded executor for outgoing webhooks (see BotWebhookConfig).
    pool:
      core-size: ${BOT_WEBHOOK_POOL_CORE:4}
      max-size: ${BOT_WEBHOOK_POOL_MAX:16}
      queue-capacity: ${BOT_WEBHOOK_POOL_QUEUE:500}
    connect-timeout-ms: ${BOT_WEBHOOK_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${BOT_WEBHOOK_READ_TIMEOUT_MS:5000}

logging:
  level:
    root: INFO
    com.messenger: DEBUG
